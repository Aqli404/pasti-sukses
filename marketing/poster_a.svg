<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1930"/>
      <stop offset="0.55" stop-color="#0D2A52"/>
      <stop offset="1" stop-color="#123C6E"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#38BDF8" stroke-opacity="0.07" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#grid)"/>
  <circle cx="120" cy="250" r="420" fill="url(#glow1)"/>
  <circle cx="980" cy="1680" r="480" fill="url(#glow2)"/>

  <!-- decorative constellation, kept clear of badges/headline/CTA -->
  <g stroke="#38BDF8" stroke-opacity="0.22" stroke-width="2" fill="none">
    <path d="M -40 200 L 150 130 L 360 195 L 560 120"/>
    <path d="M 1000 1300 L 1060 1240 L 1140 1300"/>
  </g>
  <g fill="#38BDF8">
    <circle cx="150" cy="130" r="6" fill-opacity="0.7"/>
    <circle cx="360" cy="195" r="5" fill-opacity="0.55"/>
    <circle cx="560" cy="120" r="6" fill-opacity="0.7"/>
    <circle cx="1060" cy="1240" r="5" fill-opacity="0.5"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <!-- badge: pill width now matches the measured text (518px) with padding -->
    <rect x="200" y="330" width="680" height="64" rx="32" fill="#38BDF8" fill-opacity="0.14" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="2"/>
    <text x="540" y="373" font-size="28" font-weight="600" fill="#7DD3FC" letter-spacing="2">GRATIS • OTOMATIS • TIAP JAM</text>

    <!-- headline -->
    <text x="540" y="560" font-size="96" font-weight="800" fill="#FFFFFF">CAPEK SCROLL</text>
    <text x="540" y="680" font-size="96" font-weight="800" fill="#FFFFFF">CARI KERJA?</text>
    <rect x="440" y="725" width="200" height="8" rx="4" fill="#38BDF8"/>

    <!-- sub -->
    <text x="540" y="830" font-size="52" font-weight="600" fill="#BAE6FD">Biarin bot yang nyariin 🤖</text>

    <!-- feature card -->
    <rect x="140" y="920" width="800" height="400" rx="36" fill="#0F2B52" fill-opacity="0.85" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="2"/>
    <text x="210" y="1030" font-size="44" text-anchor="start" fill="#FFFFFF">✅  Lowongan baru <tspan font-weight="700" fill="#7DD3FC">tiap jam</tspan></text>
    <text x="210" y="1130" font-size="44" text-anchor="start" fill="#FFFFFF">✅  Sesuai <tspan font-weight="700" fill="#7DD3FC">bidang &amp; lokasimu</tspan></text>
    <text x="210" y="1230" font-size="44" text-anchor="start" fill="#FFFFFF">✅  Langsung ke <tspan font-weight="700" fill="#7DD3FC">Telegram</tspan></text>

    <!-- mini stats strip -->
    <text x="540" y="1420" font-size="34" fill="#93C5FD">6 sumber sekaligus: global + Indonesia 🌏</text>

    <!-- CTA -->
    <rect x="190" y="1520" width="700" height="120" rx="60" fill="url(#cta)"/>
    <text x="540" y="1596" font-size="44" font-weight="800" fill="#FFFFFF">👉  t.me/Sukses_Rosif_bot</text>

    <!-- brand -->
    <text x="540" y="1760" font-size="40" font-weight="700" fill="#E0F2FE">🌟 Pasti Sukses Bot</text>
    <text x="540" y="1815" font-size="28" fill="#7DD3FC" fill-opacity="0.8">Kerja datang ke kamu, bukan kamu yang mengejar</text>
  </g>
</svg>
