<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="0.5" stop-color="#0E2C57"/>
      <stop offset="1" stop-color="#14457F"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#60A5FA" stroke-opacity="0.08" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#grid)"/>
  <circle cx="950" cy="260" r="430" fill="url(#glowTop)"/>
  <circle cx="130" cy="1680" r="470" fill="url(#glowBot)"/>

  <!-- phone chat mockup -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- headline -->
    <text x="540" y="330" text-anchor="middle" font-size="88" font-weight="800" fill="#FFFFFF">KIRIMAN KERJA</text>
    <text x="540" y="445" text-anchor="middle" font-size="88" font-weight="800" fill="#7DD3FC">TIAP JAM</text>
    <text x="540" y="545" text-anchor="middle" font-size="48" font-weight="600" fill="#BAE6FD">langsung ke Telegrammu 🤖</text>

    <!-- chat bubble mock -->
    <rect x="150" y="640" width="780" height="560" rx="40" fill="#0F2B52" fill-opacity="0.9" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="230" y="700" width="620" height="96" rx="24" fill="#1B3E6F"/>
    <text x="262" y="748" font-size="34" font-weight="700" fill="#7DD3FC">🏠 Senior Backend Engineer</text>
    <text x="262" y="784" font-size="26" fill="#CBD5E1">Lemon.io · Worldwide · 5 sumber ✨</text>

    <rect x="230" y="820" width="620" height="96" rx="24" fill="#1B3E6F"/>
    <text x="262" y="868" font-size="34" font-weight="700" fill="#7DD3FC">🎨 UI/UX Designer</text>
    <text x="262" y="904" font-size="26" fill="#CBD5E1">Startup ID · Jakarta · baru masuk 🔥</text>

    <rect x="230" y="940" width="620" height="96" rx="24" fill="#1B3E6F"/>
    <text x="262" y="988" font-size="34" font-weight="700" fill="#7DD3FC">📢 Digital Marketing</text>
    <text x="262" y="1024" font-size="26" fill="#CBD5E1">E-commerce · Remote · sesuai profilmu</text>

    <text x="540" y="1130" text-anchor="middle" font-size="30" fill="#93C5FD">…dan ratusan lainnya, otomatis terfilter ⚡</text>

    <!-- features -->
    <text x="540" y="1290" text-anchor="middle" font-size="42" font-weight="700" fill="#FFFFFF">GRATIS · Tanpa daftar ribet · Link langsung lamar 💼</text>

    <!-- CTA -->
    <rect x="190" y="1420" width="700" height="120" rx="60" fill="url(#cta)"/>
    <text x="540" y="1496" text-anchor="middle" font-size="44" font-weight="800" fill="#FFFFFF">👉  t.me/Sukses_Rosif_bot</text>

    <!-- brand -->
    <text x="540" y="1660" text-anchor="middle" font-size="40" font-weight="700" fill="#E0F2FE">🌟 Pasti Sukses Bot</text>
    <text x="540" y="1715" text-anchor="middle" font-size="28" fill="#7DD3FC" fill-opacity="0.85">Pilih bidang + lokasi sekali, sisanya biarin bot 💙</text>
  </g>
</svg>
